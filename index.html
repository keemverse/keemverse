
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>KEEMVERSE</title>
      <meta name="description" content="Fashion finds and Lightroom presets, plus original art to wear, download, or have made for you." />
      <meta name="theme-color" content="#FBFAF7" />

      <!-- Link previews (TikTok, WhatsApp, Instagram, X, iMessage do not run scripts, so these are brand-level) -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="KEEMVERSE" />
      <meta property="og:title" content="KEEMVERSE: one creator, two crafts" />
      <meta property="og:description" content="Fashion finds and Lightroom presets, plus original art to wear, download, or have made for you." />
      <meta property="og:url" content="https://www.keemverse.com/" />
      <meta property="og:image" content="https://www.keemverse.com/og-image.jpg" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="KEEMVERSE: one creator, two crafts" />
      <meta name="twitter:description" content="Fashion finds and Lightroom presets, plus original art to wear, download, or have made for you." />
      <meta name="twitter:image" content="https://www.keemverse.com/og-image.jpg" />
      <link rel="icon" type="image/png" href="/kv-icon.png" />
      <link rel="apple-touch-icon" href="/kv-icon.png" />

      <!-- Brand typeface: Satoshi (Identity System v4), self-hosted. Preloaded so text paints in it on the first frame. -->
      <link rel="preload" href="/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

      <!-- Presets page, opened straight from a link: start downloading the catalog now instead of
           after the scripts have loaded, and preload the first before/after photos as soon as their
           names are known. The page picks the early download up (lib/products.ts) and falls back to
           its own request if this one fails. -->
      <script>
        if (location.pathname.indexOf('/fashion/presets') === 0) {
          var early = fetch('/api/products?type=preset').then(function (r) {
            if (!r.ok) throw new Error('catalog');
            return r.json();
          });
          window.__kvPresets = early;
          early.then(function (items) {
            var shown = items
              .filter(function (i) { return i.before_image && i.after_image; })
              .sort(function (a, b) { return (a.display_order == null ? 999 : a.display_order) - (b.display_order == null ? 999 : b.display_order); })[0];
            if (!shown) return;
            [shown.before_image, shown.after_image].forEach(function (href) {
              var l = document.createElement('link');
              l.rel = 'preload';
              l.as = 'image';
              l.href = href;
              document.head.appendChild(l);
            });
          }).catch(function () {});
        }
      </script>

      <!-- Vercel Web Analytics: page views and referrers (TikTok vs Instagram vs direct).
           Loaded only on the live domain, so local work and preview URLs never count.
           Needs Web Analytics switched on in the Vercel project (Analytics tab). -->
      <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        if (/(^|\.)keemverse\.com$/.test(location.hostname)) {
          var s = document.createElement('script');
          s.defer = true;
          s.src = '/_vercel/insights/script.js';
          document.head.appendChild(s);
        }
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
